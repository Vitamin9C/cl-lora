[project]
name = "cl-lora"
version = "0.1.0"
description = "Continual Learning with LoRA for Vision Transformers on BigEarthNet-V2"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "pytorch-lightning>=2.0",
    "torchvision",
    "timm",
    "einops",
    "pandas",
    "numpy",
    "pyarrow",
    "pyyaml",
    "python-dotenv",
    "safetensors",
    "joblib",
    "scikit-learn",
    "typer",
    "configilm",
]

[project.optional-dependencies]
dev = [
    "ruff",
]

[project.scripts]
cl-train = "cl_lora.experiments.baseline:main"
cl-merge = "cl_lora.experiments.merge:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cl_lora"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
